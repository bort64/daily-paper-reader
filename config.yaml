subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: search-rec
      description: 搜广推、规模化扩展、生成式搜广推及AI检索相关论文
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: generative retrieval
          keyword_cn: 生成式检索
          query: generative retrieval models that directly generate document identifiers for web search
        - keyword: generative recommendation
          keyword_cn: 生成式推荐
          query: generative recommendation systems that autoregressively produce item lists or next item predictions
        - keyword: generative advertising
          keyword_cn: 生成式广告
          query: generative models for ad retrieval, ad ranking, and sponsored content generation
        - keyword: search advertising recommendation
          keyword_cn: 搜索广告推荐
          query: joint modeling and serving of search, advertising, and recommendation systems at scale
        - keyword: recommendation scaling laws
          keyword_cn: 推荐系统扩展规律
          query: empirical scaling laws for recommender systems describing data size, model capacity, and ranking quality
        - keyword: scaling up recommendation models
          keyword_cn: 扩展推荐模型
          query: techniques for scaling up deep learning based recommendation and ranking models on large user item graphs
      intent_queries:
        - query: >-
            papers that study scaling up search advertising and recommendation systems including model size, data scale,
            and training efficiency
          query_cn: 关于扩展搜索、广告、推荐系统（模型规模、数据规模、训练效率）的论文
          enabled: true
          source: manual
          note: ''
        - query: >-
            generative search, advertising, and recommendation methods based on large language models or generative
            retrieval
          query_cn: 基于大语言模型或生成式检索的生成式搜索、广告和推荐方法
          enabled: true
          source: manual
          note: ''
        - query: >-
            modern transformer and generative architectures for web search and recommender systems beyond traditional
            statistical models
          query_cn: 面向网页搜索和推荐系统的 transformer 与生成式架构方法
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-09-09T09:36:51.086Z'
    - tag: rank-mixer
      description: 精排模型场景的mixer结构相关论文调研，用于与UniMixer等进行比较的Related Work部分
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: mixer architecture ranking
          keyword_cn: 排序模型中的Mixer架构
          query: mixer architecture for learning to rank
        - keyword: feature interaction network
          keyword_cn: 特征交互网络
          query: feature interaction network for deep ranking models
        - keyword: multilayer perceptron mixer
          keyword_cn: 多层感知机Mixer
          query: multilayer perceptron mixer for ranking models
        - keyword: unified mixer model
          keyword_cn: 统一Mixer模型
          query: unified mixer architecture for ranking model
        - keyword: recommendation ranking model
          keyword_cn: 推荐排序模型
          query: CTR prediction ranking model architecture with mixer
        - keyword: attention free architecture
          keyword_cn: 无注意力架构
          query: attention free mixer architecture for ranking tasks
      intent_queries:
        - query: Find related work on mixer based architectures for deep learning ranking systems
          query_cn: 查找深度学习排序系统中基于Mixer架构的相关工作
          enabled: true
          source: manual
          note: ''
        - query: Compare UniMixer with other mixer and Transformer based ranking models
          query_cn: 比较UniMixer与其他基于Mixer和Transformer的排序模型
          enabled: true
          source: manual
          note: ''
        - query: Search for papers on feature interaction networks in recommender systems and ranking
          query_cn: 搜索推荐系统和排序中特征交互网络的相关论文
          enabled: true
          source: manual
          note: ''
        - query: Identify key differences between ResNet and mixer layers for click through rate prediction
          query_cn: 识别ResNet与Mixer层在点击率预测中的关键区别
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-09-09T12:23:56.960Z'
